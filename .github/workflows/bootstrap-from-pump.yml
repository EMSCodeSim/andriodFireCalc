# One-time bootstrap/rebuild workflow for the dedicated Android repo.
name: Bootstrap Android from pump

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-from-pump.yml'

permissions:
  contents: write

concurrency:
  group: fireopscalc-android-bootstrap
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Android repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Pull latest Android source from legacy pump repo
        shell: bash
        run: |
          rm -rf /tmp/fireops-pump
          git clone --depth 1 https://github.com/EMSCodeSim/pump.git /tmp/fireops-pump
          test -f /tmp/fireops-pump/dist/index.html
          test -f /tmp/fireops-pump/android/app/build.gradle

      - name: Restore app web bundle
        shell: bash
        run: |
          rm -rf www
          mkdir -p www
          cp -a /tmp/fireops-pump/dist/. www/
          test -f www/index.html
          test -f www/js/paywall.js

      - name: Install Capacitor 8 and purchase plugin
        run: npm install --no-audit --no-fund

      - name: Generate fresh Capacitor 8 Android project
        shell: bash
        run: |
          rm -rf android
          npx cap add android

      - name: Restore FireOps Android icons and splash artwork
        shell: bash
        run: |
          shopt -s nullglob
          for src in /tmp/fireops-pump/android/app/src/main/res/mipmap* /tmp/fireops-pump/android/app/src/main/res/drawable*; do
            name="$(basename "$src")"
            rm -rf "android/app/src/main/res/$name"
            cp -a "$src" "android/app/src/main/res/$name"
          done

      - name: Sync plugins and enforce API 36 release settings
        shell: bash
        run: |
          npx cap sync android
          node scripts/patch-android-api36.mjs
          node scripts/verify-api36.mjs

      - name: Build release app bundle
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Upload test AAB
        uses: actions/upload-artifact@v4
        with:
          name: FireOpsCalc-9.1.4-API36-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Commit rebuilt Android source
        shell: bash
        run: |
          git config user.name "EMSCodeSim Android Rebuild"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json www android
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
            exit 0
          fi
          git commit -m "Rebuild FireOps Calc Android for API 36"
          git push origin HEAD:main
