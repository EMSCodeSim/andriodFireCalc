name: Build legacy FireOps Calc Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'www/**'
      - 'android/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/bootstrap-from-pump.yml'

permissions:
  contents: read

concurrency:
  group: fireopscalc-legacy-android
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out dedicated legacy Android repo
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync dedicated Android project
        run: npm run android:sync

      - name: Verify Play identity and Android 16 requirements
        run: npm run android:verify

      - name: Build release AAB
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@v4
        with:
          name: FireOpsCalc-legacy-9.1.4-v94-API36-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

# IMPORTANT:
# This workflow intentionally does NOT clone EMSCodeSim/pump, FireOpsCalc,
# or any website/Flutter repository. The committed www/ directory in this
# repository is the source of truth for the legacy Google Play application.
# Production signing remains handled separately (for example by Codemagic)
# with the existing Google Play upload key.
