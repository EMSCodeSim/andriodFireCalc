name: Apply legacy Android HTML cleanup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-legacy-stability-html.yml'

permissions:
  contents: write

concurrency:
  group: fireopscalc-legacy-html-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove web-only tracking and advertising loaders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('www/calculator.html')
          text = path.read_text()
          original = text

          # Remove the external AdSense loader. The legacy native calculator does
          # not need web advertising and should not make this network request.
          text = re.sub(
              r'\n\s*<script\s+async\s+src="https://pagead2\.googlesyndication\.com/[^\"]+"\s*\n?\s*crossorigin="anonymous"></script>\s*',
              '\n',
              text,
              count=1,
              flags=re.S,
          )

          # Remove Google Analytics / gtag loader and initialization block.
          text = re.sub(
              r'\n\s*<!-- Google tag \(gtag\.js\) -->\s*'
              r'<script\s+async\s+src="https://www\.googletagmanager\.com/gtag/js\?id=[^\"]+"></script>\s*'
              r'<script>.*?gtag\(\s*[\'\"]config[\'\"].*?</script>\s*',
              '\n',
              text,
              count=1,
              flags=re.S,
          )

          # Correct an old comment that suggested native JS came from the live site.
          text = text.replace(
              "// If we're inside the native app, pull JS from the live website so Android can't\n      // get stuck on an older bundled copy.",
              "// The legacy Android app always runs its committed local JS bundle."
          )

          forbidden = ('googlesyndication.com', 'googletagmanager.com', "gtag('config'", 'gtag("config"')
          remaining = [token for token in forbidden if token in text]
          if remaining:
              raise SystemExit(f'Web tracking/advertising loader still present: {remaining}')

          if text != original:
              path.write_text(text)
          else:
              print('calculator.html already clean')
          PY

      - name: Commit cleaned legacy calculator
        shell: bash
        run: |
          if git diff --quiet -- www/calculator.html; then
            echo "No calculator HTML changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/calculator.html
          git commit -m "Remove web tracking from legacy Android calculator"
          git push origin HEAD:main
