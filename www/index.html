<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060d17" />
  <title>FireOps Calc</title>
  <link rel="stylesheet" href="ccs/mobile-friendly.css?v=android-20260829" />
  <style>
    :root {
      --shell-bg: #060d17;
      --shell-panel: #0b1320;
      --shell-edge: #18304d;
      --shell-text: #e9f1ff;
      --shell-muted: #a9bdd8;
      --shell-accent: #46b0ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--shell-bg);
      color: var(--shell-text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    }

    .app-shell {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: 10px 10px 18px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(70, 176, 255, .35);
      border-radius: 16px;
      background: linear-gradient(135deg, #050a14, #0b1525);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .45);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand img {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border-radius: 9px;
      object-fit: cover;
      background: #02050b;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: .01em;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--shell-muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .setup-button {
      min-height: 42px;
      border: 1px solid #2a5685;
      border-radius: 999px;
      padding: 8px 12px;
      background: #081525;
      color: #eef7ff;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .setup-button:active { transform: translateY(1px); }
    .setup-button[hidden] { display: none; }

    #app {
      min-height: calc(100dvh - 82px - env(safe-area-inset-top, 0) - env(safe-area-inset-bottom, 0));
    }

    .loading-card,
    .gate-card {
      border: 1px solid var(--shell-edge);
      border-radius: 14px;
      background: var(--shell-panel);
      padding: 18px;
      color: var(--shell-text);
    }

    .loading-card {
      color: var(--shell-muted);
    }

    .gate-card h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .gate-card p {
      margin: 0 0 8px;
      line-height: 1.45;
      color: #d9e7f9;
    }

    .gate-card .gate-note {
      color: var(--shell-muted);
      font-size: 12px;
    }

    @media (max-width: 430px) {
      .app-shell { padding-left: 8px; padding-right: 8px; }
      .brand-subtitle { display: none; }
      .setup-button { padding-inline: 10px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand" aria-label="FireOps Calc">
        <img src="fireopscalc2.png" alt="" aria-hidden="true" />
        <div class="brand-copy">
          <div class="brand-title">FireOps Calc</div>
          <div class="brand-subtitle">Android visual pump calculator</div>
        </div>
      </div>
      <button id="departmentSetup" class="setup-button" type="button">Department Setup</button>
    </header>

    <main id="app" aria-live="polite">
      <div class="loading-card">Loading calculator…</div>
    </main>
  </div>

  <script type="module" src="js/android-main.js?v=20260829"></script>
</body>
</html>
